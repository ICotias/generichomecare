version: 2
updates:
  # Dependências npm do app
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    # Agrupa atualizações menores para reduzir ruído
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Atualizações das GitHub Actions (se houver workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
